# A plugin in its own image: anything that runs in a Linux container (Go, Rust, Java, ...). The bot builds the
# Dockerfile and runs the image's entrypoint under the same lockdown as any service.
name: docker-hello
description: Pozdraví kanál z vlastního Docker image - ukázka pluginu v čemkoli.
version: 1.0.0
run:
  command: dockerhello
tools: [say_channel]
settings:
  greeting: co má pozdrav říct (volitelné)
